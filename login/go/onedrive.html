<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login with Google</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <a id="continue" style="display: none">Continue</a>
    <script>
      (() => {
        const clientId = 'd742c0ec-f3ba-4ce9-949a-56507e86ca98';
        const search = new URLSearchParams(location.search);
        const params = new URLSearchParams();
        params.append('client_id', clientId);
        params.append('response_type', 'code');
        params.append('redirect_uri', 'https://login.microsoftonline.com/common/oauth2/nativeclient');
        params.append('response_mode', 'query');
        params.append('scope', search.get("scope"));
        params.append('state', search.get("state"));
        const url = "https://login.microsoftonline.com/common/oauth2/v2.0/authorize?" + params.toString();
        document.getElementById("continue").href = url;
        document.getElementById("continue").style.display = "block";
        setTimeout(() => {
          window.location.href = url;
        }, 100);
      })();
    </script>
  </body>
</html>
