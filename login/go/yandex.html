<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login with Google</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <a id="continue" style="display: none">Continue</a>
    <script>
      (() => {
        const clientId = "5e2610db11c448378cb5028f647a17a0";
        const search = new URLSearchParams(location.search);
        const params = new URLSearchParams();
        params.append("response_type", "token");
        params.append("state", search.get("state"));
        params.append("client_id", clientId);
        const url = "https://oauth.yandex.com/authorize?" + params.toString();
        document.getElementById("continue").href = url;
        document.getElementById("continue").style.display = "block";
        setTimeout(() => {
          window.location.href = url;
        }, 100);
      })();
    </script>
  </body>
</html>
